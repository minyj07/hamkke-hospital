name: hamkke_hospital
description: "메디움 - 장애 유형과 필요한 진료에 맞는 병원을 추천합니다."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.3
  geolocator: ^14.1.1
  http: ^1.6.0
  path_provider: ^2.1.6
  crypto: ^3.0.8
  share_plus: ^13.3.1
  flutter_naver_map: ^1.4.4
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  wakelock_plus: ^1.8.0
  package_info_plus: ^10.2.2
  quick_actions: ^1.1.1
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/hospitals/
    - assets/brand/
    - assets/ai/
    - assets/fonts/OFL.txt

  # 디자인 글꼴. Pretendard 1.3.9 공식 서브셋(한글 2,780자와 영문·기호, SIL OFL 1.1, assets/fonts/OFL.txt).
  # github.com/orioncactus/pretendard 의 packages/pretendard/dist/web/static/woff-subset/ 의 WOFF 를
  # 받아 git 해시를 확인하고, 표 데이터는 그대로 둔 채 TTF 로 풀기만 했다 (Flutter 는 WOFF 를 못 읽는다).
  # 서브셋에 없는 드문 한글은 휴대폰 글꼴로 보인다. 예전의 PretendardStd 는 한글이 없는 판이라 뺐다.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.subset.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.subset.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.subset.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.subset.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.subset.ttf
          weight: 800

# 앱 아이콘: 흰 바탕에 메디움 아이콘(assets/icon/app_icon.svg, 2026-10-30 사용자가 준 medium.svg).
# 원본 PNG(assets/icon/, 앱에는 넣지 않음)는 이 SVG 로 그린다. 아이콘을 바꾸면 `RENDER_ICONS=1 flutter test test/tools/render_brand_icons_test.dart` 뒤
# `dart run flutter_launcher_icons` 를 돌린다.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  remove_alpha_ios: true
