# 공공데이터 API 로 병원 데이터를 새로 만들어 GitHub Pages 에 올린다.
# 설치된 앱은 켤 때 <Pages 주소>/v1/meta.json 을 보고 바뀐 파일만 내려받는다 (lib/data/data_store.dart).
#
# 처음 한 번 설정 (README.md 의 "병원 데이터 자동 업데이트" 참고)
#   1. Settings → Secrets and variables → Actions 에 DATA_GO_KR_SERVICE_KEY 저장
#   2. Settings → Pages → Build and deployment → Source 를 GitHub Actions 로
name: 병원 데이터 갱신

on:
  schedule:
    - cron: "0 18 * * 0" # 매주 월요일 새벽 3시 (한국 시간)
  workflow_dispatch:
    inputs:
      build:
        description: "공공데이터 API 로 새로 만들기 (끄면 저장소의 assets/data 를 그대로 배포)"
        type: boolean
        default: true
      force:
        description: "병원 수가 크게 줄어도 배포 (시·도 통합처럼 의도한 변화일 때만)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v6

      - name: 스크립트 테스트
        run: python -m unittest discover -s tools

      # 예약 실행은 늘 새로 만든다. inputs.build != false 로 쓰면 안 된다:
      # 예약 실행에서 inputs.build 는 null 이고, Actions 식은 null 과 false 를 둘 다 0 으로 보고 같다고 한다.
      - name: 인증키 준비
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build }}
        env:
          KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "DATA_GO_KR_SERVICE_KEY 시크릿이 없습니다."; exit 1; fi
          printf 'DATA_GO_KR_SERVICE_KEY=%s\n' "$KEY" > tools/.env

      - name: 데이터 만들기
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build }}
        run: python tools/build_data.py --refresh

      # API 가 일부만 응답해 반쪽짜리 데이터가 앱에 내려가지 않게, 지금 배포된 것과 비교한다.
      - name: 데이터 검사
        env:
          FORCE: ${{ inputs.force }}
          PREVIOUS: ${{ steps.pages.outputs.base_url }}/v1/meta.json
        run: |
          if [ "$FORCE" = "true" ]; then
            python tools/verify_data.py
          else
            python tools/verify_data.py --previous "$PREVIOUS"
          fi

      - name: 배포할 파일 모으기
        run: |
          mkdir -p site/v1
          cp -r assets/data/. site/v1/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
